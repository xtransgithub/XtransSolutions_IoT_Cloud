<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Series Prediction</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Time Series Prediction</h1>
    <canvas id="predictionChart" width="400" height="200"></canvas>
    
    <script>
        // Function to fetch prediction data from the Node.js backend
        async function getPrediction(forecastPeriod = 1, predictionType = 'temperature') {
            try {
                // Sending POST request to Node.js server
                const response = await fetch('http://localhost:3000/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ forecastPeriod, predictionType })
                });

                if (response.ok) {
                    const data = await response.json();
                    console.log("Received data from Node.js server:", data);
                    if (data.forecast) {
                        renderChart(data.forecast);  // Render the chart with the forecast data
                    } else {
                        console.error('No forecast data returned');
                    }
                } else {
                    console.error('Error fetching prediction:', response.statusText);
                }
            } catch (error) {
                console.error('Error during request:', error);
            }
        }

        // Function to render the chart using Chart.js
        function renderChart(forecast) {
            const ctx = document.getElementById('predictionChart').getContext('2d');
            if (!ctx) {
                console.error('Chart container not found');
                return;
            }

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array.from({ length: forecast.length }, (_, i) => `Day ${i + 1}`),
                    datasets: [{
                        label: 'Forecasted Temperature',
                        data: forecast,
                        borderColor: 'rgba(75, 192, 192, 1)',
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: false,
                            title: { display: true, text: 'Temperature (°C)' }
                        },
                        x: {
                            title: { display: true, text: 'Days' }
                        }
                    }
                }
            });
        }

        // Fetch prediction for the next 7 days (example)
        getPrediction(7, 'temperature');
    </script>
</body>
</html>
